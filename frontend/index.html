<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RedMnist API</title>
<style>
  :root {
    --wine: #722f37;
    --wine-dark: #4e1f26;
    --wine-light: #8f3d47;
    --white: #ffffff;
    --black: #0d0d0d;
    --black-soft: #1a1a1a;
    --border: rgba(114, 47, 55, 0.25);
    --shadow: 0 4px 18px rgba(13, 13, 13, 0.15);
    --radius: 14px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
    background: var(--black);
    color: var(--white);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 40px 16px;
    -webkit-font-smoothing: antialiased;
  }

  .container { width: 100%; max-width: 520px; }

  header {
    text-align: center;
    margin-bottom: 24px;
  }

  header h1 {
    margin: 0 0 6px;
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.3px;
    color: var(--white);
  }

  header h1 span { color: var(--wine-light); }

  header p {
    margin: 0;
    font-size: 13px;
    color: rgba(255, 255, 255, 0.55);
  }

  .card {
    background: var(--black-soft);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px;
    box-shadow: var(--shadow);
    transition: box-shadow 0.25s ease, transform 0.25s ease;
  }

  .card:hover {
    box-shadow: 0 8px 26px rgba(114, 47, 55, 0.35);
  }

  .drop-zone {
    border: 1.5px dashed var(--wine);
    border-radius: 10px;
    padding: 24px 16px;
    text-align: center;
    cursor: pointer;
    background: rgba(114, 47, 55, 0.08);
    transition: all 0.2s ease;
  }

  .drop-zone:hover,
  .drop-zone.dragover {
    border-color: var(--wine-light);
    background: rgba(114, 47, 55, 0.2);
    transform: translateY(-1px);
  }

  .drop-zone p {
    margin: 0;
    font-size: 13px;
    color: rgba(255, 255, 255, 0.6);
  }

  .drop-zone .highlight {
    color: var(--wine-light);
    font-weight: 600;
  }

  input[type="file"] { display: none; }

  .preview {
    margin-top: 16px;
    text-align: center;
    display: none;
  }

  .preview img {
    max-width: 120px;
    max-height: 120px;
    border: 1px solid var(--wine);
    border-radius: 8px;
    padding: 6px;
    background: var(--black);
  }

  button {
    margin-top: 16px;
    width: 100%;
    padding: 10px 16px;
    font-size: 14px;
    font-weight: 600;
    color: var(--white);
    background: var(--wine);
    border: none;
    border-radius: 10px;
    cursor: pointer;
    letter-spacing: 0.2px;
    transition: background 0.2s, transform 0.08s, box-shadow 0.2s;
    box-shadow: 0 4px 12px rgba(114, 47, 55, 0.45);
  }

  button:hover:not(:disabled) {
    background: var(--wine-light);
    box-shadow: 0 6px 18px rgba(114, 47, 55, 0.6);
    transform: translateY(-1px);
  }

  button:active:not(:disabled) {
    transform: translateY(0);
    box-shadow: 0 2px 8px rgba(114, 47, 55, 0.45);
  }

  button:disabled {
    background: rgba(114, 47, 55, 0.3);
    box-shadow: none;
    cursor: not-allowed;
    color: rgba(255, 255, 255, 0.4);
  }

  .result {
    margin-top: 16px;
    padding: 14px;
    border-radius: 10px;
    font-size: 14px;
    line-height: 1.5;
    display: none;
    animation: fadeIn 0.3s ease;
  }

  .result.show { display: block; }

  .result.success {
    background: rgba(114, 47, 55, 0.15);
    border: 1px solid var(--wine);
    color: var(--white);
  }

  .result.error {
    background: rgba(13, 13, 13, 0.9);
    border: 1px solid var(--wine-dark);
    color: var(--white);
  }

  .result .big {
    font-size: 26px;
    font-weight: 700;
    color: var(--wine-light);
    display: block;
    margin: 2px 0 6px;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to   { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Red <span>MNIST</span></h1>
      <p>Handwritten digit recognition · FastAPI + PyTorch</p>
    </header>
    <div class="card">
      <div class="drop-zone" id="dropZone">
        <p><span class="highlight">Click to upload</span> or drag &amp; drop an image</p>
        <p style="margin-top:4px;font-size:12px;">PNG / JPG — a single handwritten digit (0–9)</p>
      </div>
      <input type="file" id="fileInput" accept="image/*" />

      <div class="preview" id="preview">
        <img id="previewImg" alt="preview" />
      </div>

      <button id="predictBtn" disabled>Predict Digit</button>

      <div class="result" id="result"></div>
    </div>
  </div>

<script>
  const API_URL = "http://127.0.0.1:8000/predict";

  const dropZone   = document.getElementById("dropZone");
  const fileInput  = document.getElementById("fileInput");
  const preview    = document.getElementById("preview");
  const previewImg = document.getElementById("previewImg");
  const predictBtn = document.getElementById("predictBtn");
  const resultBox  = document.getElementById("result");

  let selectedFile = null;

  dropZone.addEventListener("click", () => fileInput.click());

  ["dragenter", "dragover"].forEach(evt =>
    dropZone.addEventListener(evt, e => {
      e.preventDefault();
      dropZone.classList.add("dragover");
    })
  );
  ["dragleave", "drop"].forEach(evt =>
    dropZone.addEventListener(evt, e => {
      e.preventDefault();
      dropZone.classList.remove("dragover");
    })
  );
  dropZone.addEventListener("drop", e => {
    const file = e.dataTransfer.files[0];
    if (file) handleFile(file);
  });

  fileInput.addEventListener("change", e => {
    const file = e.target.files[0];
    if (file) handleFile(file);
  });

  function handleFile(file) {
    if (!file.type.startsWith("image/")) {
      showResult("error", "Please select a valid image file.");
      return;
    }
    selectedFile = file;
    previewImg.src = URL.createObjectURL(file);
    preview.style.display = "block";
    predictBtn.disabled = false;
    resultBox.className = "result";
  }

  predictBtn.addEventListener("click", async () => {
    if (!selectedFile) return;

    predictBtn.disabled = true;
    predictBtn.textContent = "Predicting...";
    showResult("success", "Sending image to the model...");

    const formData = new FormData();
    formData.append("file", selectedFile);

    try {
      const res = await fetch(API_URL, { method: "POST", body: formData });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.detail || `HTTP ${res.status}`);
      }
      const data = await res.json();
      showResult(
        "success",
        `<span class="big">${data.predicted_class}</span>
         Confidence: <strong>${(data.confidence * 100).toFixed(2)}%</strong>`
      );
    } catch (err) {
      showResult(
        "error",
        `Prediction failed: ${err.message}<br/>
         <small>Is the FastAPI server running at <code>127.0.0.1:8000</code>?</small>`
      );
    } finally {
      predictBtn.disabled = false;
      predictBtn.textContent = "Predict Digit";
    }
  });

  function showResult(type, html) {
    resultBox.className = "result show " + type;
    resultBox.innerHTML = html;
  }
</script>
</body>
</html>
